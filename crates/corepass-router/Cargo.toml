[package]
name = "corepass-router"
version = "0.3.0"
edition = "2021"
license = "MIT"

[dependencies]
corepass-core = { path = "../corepass-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
url = "2"

[dev-dependencies]
tempfile = "3"

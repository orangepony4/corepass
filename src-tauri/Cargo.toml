[package]
name = "corepass"
version = "0.3.0"
edition = "2021"
license = "MIT"
default-run = "corepass"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde_json = "1"
corepass-core = { path = "../crates/corepass-core" }

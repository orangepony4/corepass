name: Build and verify Corepass
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: python scripts/fetch-engine.py windows
      - run: cargo test -p corepass-core --features selfhost,sui --locked
      - run: cargo test -p corepass-selfhost --locked
      - run: cargo test -p corepass-sui --locked
      - run: npm test
      - run: npm run tauri build -- --no-bundle
      - name: Package portable app
        shell: pwsh
        run: |
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $release="artifacts/Corepass-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item target/release/corepass.exe "$release/Corepass-Next.exe"
          Copy-Item src-tauri/resources/engine $release -Recurse
          Copy-Item README.md,LICENSE,THIRD-PARTY.md $release
          Compress-Archive "$release/*" "artifacts/Corepass-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Corepass-Windows
          path: artifacts/Corepass-*-windows-x64.zip
          retention-days: 14
  router:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install native ARM64 build tools
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools squashfs-tools busybox-static
      - run: cargo test -p corepass-core -p corepass-router --locked
      - name: Build static router controller
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build -p corepass-router --release --target aarch64-unknown-linux-musl --locked
      - run: python3 scripts/fetch-engine.py router
      - name: Validate actual engine and configuration
        run: |
          target/aarch64-unknown-linux-musl/release/corepass-router render < router/tests/render-input.json > artifacts/router-test.json
          artifacts/router-engine/sing-box check -c artifacts/router-test.json
          file target/aarch64-unknown-linux-musl/release/corepass-router artifacts/router-engine/sing-box
      - name: Build compressed runtime and test read-only execution
        run: |
          mkdir -p artifacts/runtime
          cp artifacts/router-engine/sing-box artifacts/router-engine/LICENSE artifacts/runtime/
          cp target/aarch64-unknown-linux-musl/release/corepass-router artifacts/runtime/
          mksquashfs artifacts/runtime artifacts/corepass-openwrt-arm64.squashfs -comp xz -b 262144 -noappend -all-root -no-xattrs
          test "$(stat -c %s artifacts/corepass-openwrt-arm64.squashfs)" -le 29360128
          mkdir -p artifacts/mounted
          sudo mount -t squashfs -o loop,ro artifacts/corepass-openwrt-arm64.squashfs artifacts/mounted
          artifacts/mounted/corepass-router render < router/tests/render-input.json > artifacts/mounted-test.json
          artifacts/mounted/sing-box check -c artifacts/mounted-test.json
          sudo umount artifacts/mounted
      - name: Build UI archive and validate installer
        run: |
          python3 scripts/package-router.py
          python3 router/tests/check-installer.py
          sudo python3 router/tests/install-sandbox.py
          sh -n router/install.sh
          busybox sh -n router/install.sh
          sh -n router/root/etc/init.d/corepass
          sh -n router/root/usr/libexec/corepass/mount-engine
      - uses: actions/upload-artifact@v4
        with:
          name: Corepass-OpenWrt
          path: |
            artifacts/corepass-openwrt-arm64.squashfs
            artifacts/corepass-openwrt-ui.tar.gz
            router/install.sh
          retention-days: 14
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s server/tests -v
      - run: python3 -m py_compile server/controller.py
      - run: python3 server/tests/check_caddy.py
      - run: python3 crates/corepass-selfhost/tests/bootstrap_framing.py
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, router, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Corepass-Windows
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Corepass-OpenWrt
          path: router-release
      - name: Assemble checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          test "$TAG" = "v$VERSION"
          if printf '%s' "$TAG" | grep -q -- '-'; then
            cd release
            sha256sum Corepass-*-windows-x64.zip > SHA256SUMS
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Corepass $VERSION · preview" --prerelease --notes-file ../docs/release-0.4-preview.md ./*
          else
            test "$(sed -n 's/^VERSION=//p' router/install.sh)" = "$VERSION"
            find router-release -type f -name 'corepass-openwrt-*' -exec cp {} release/ \;
            cp router/install.sh release/install.sh
            cd release
            sha256sum Corepass-*-windows-x64.zip corepass-openwrt-arm64.squashfs corepass-openwrt-ui.tar.gz install.sh > SHA256SUMS
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Corepass $VERSION" --generate-notes ./*
          fi

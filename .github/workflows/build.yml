name: Build and verify Corepass
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --no-audit --no-fund
      - run: python scripts/fetch-engine.py windows
      - run: cargo test -p corepass-core --locked
      - run: npm run tauri build -- --no-bundle
      - name: Package portable app
        shell: pwsh
        run: |
          $release='artifacts/Corepass-0.3.0-windows-x64'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item target/release/corepass.exe "$release/Corepass-Next.exe"
          Copy-Item src-tauri/resources/engine $release -Recurse
          Copy-Item README.md,LICENSE,THIRD-PARTY.md $release
          Compress-Archive "$release/*" artifacts/Corepass-0.3.0-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Corepass-Windows
          path: artifacts/Corepass-0.3.0-windows-x64.zip
          retention-days: 14
